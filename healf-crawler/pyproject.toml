[project]
name = "healf-crawler"
version = "0.1.0"
description = "Scraper for a limited set of Healf products (Terranova, Life Extension, NOW Foods) — fetches and saves as clean Markdown"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.350",
    "ruff>=0.5",
    "types-requests>=2.31",
    "types-beautifulsoup4>=4.12",
]

[project.scripts]
healf-crawler = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
